<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darkroom — Image Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">DARKROOM</div>
  <div class="sep"></div>
  <button class="tbtn" onclick="triggerOpen()">Open</button>
  <button class="tbtn" onclick="undoAction()">Undo</button>
  <button class="tbtn" onclick="redoAction()">Redo</button>
  <button class="tbtn" onclick="resetAdjustments()">Reset</button>
  <button class="tbtn danger" onclick="clearCanvas()">Clear</button>
  <div class="spacer"></div>
  <button class="tbtn" onclick="zoomOut()">−</button>
  <span id="zoom-label" class="stat" style="width:42px;text-align:center"><span>100</span>%</span>
  <button class="tbtn" onclick="zoomIn()">+</button>
  <button class="tbtn" onclick="zoomFit()">Fit</button>
  <div class="sep"></div>
  <button class="tbtn-primary" onclick="exportImage()">Export</button>
</div>

<!-- TOOLS SIDEBAR -->
<div class="sidebar">
  <div class="tool active" id="tool-select" onclick="setTool('select')" title="Select / Move">
    <svg viewBox="0 0 24 24"><path d="M4 0L4 17L7.5 13.5L10.5 21L12.5 20L9.5 13L14 13Z"/></svg>
  </div>
  <div class="tool" id="tool-crop" onclick="setTool('crop')" title="Crop">
    <svg viewBox="0 0 24 24"><path d="M17 15h2V7c0-1.1-.9-2-2-2H9v2h8v8zM7 17V1H5v4H1v2h4v10c0 1.1.9 2 2 2h10v4h2v-4h4v-2H7z"/></svg>
  </div>
  <div class="tool-sep"></div>
  <div class="tool" id="tool-brush" onclick="setTool('brush')" title="Brush">
    <svg viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l9.96-9.96c.39-.39.39-1.02 0-1.41z"/></svg>
  </div>
  <div class="tool" id="tool-eraser" onclick="setTool('eraser')" title="Eraser">
    <svg viewBox="0 0 24 24"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.77-.78 2.04 0 2.83L5.03 20H12v-2H7.66L4.01 14.35 15.14 3.48l4.37 4.38-6.79 6.79 1.42 1.41 7.5-7.5c.78-.77.78-2.04 0-2.83l-4.5-4.5C16.16 3.2 15.65 3 15.14 3z"/></svg>
  </div>
  <div class="tool" id="tool-text" onclick="setTool('text')" title="Text">
    <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4z"/></svg>
  </div>
  <div class="tool" id="tool-rect" onclick="setTool('rect')" title="Rectangle">
    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
  </div>
  <div class="tool" id="tool-line" onclick="setTool('line')" title="Line">
    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" style="display:none"/><path d="M3.5 20.5l17-17" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
  </div>
  <div class="tool-sep"></div>
  <div class="tool" id="tool-eyedrop" onclick="setTool('eyedrop')" title="Eyedropper">
    <svg viewBox="0 0 24 24"><path d="M20.71 5.63l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-3.12 3.12-1.41-1.42-1.42 1.42 1.41 1.41-6.6 6.6A2 2 0 005 16v3h3c.53 0 1.04-.21 1.41-.59l6.6-6.6 1.41 1.42 1.42-1.42-1.42-1.41 3.12-3.12c.4-.4.4-1.03.01-1.42l-.84-.63zM8 17H7v-1l6.6-6.6 1 1L8 17z"/></svg>
  </div>
  <div class="tool" id="tool-blur" onclick="setTool('blur')" title="Blur Brush">
    <svg viewBox="0 0 24 24"><path d="M6 13c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0 4c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0-8c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm-3 6.5c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5zM6 5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zM3 13.5c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5zm7 7c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5zm-7-4c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5zm17 0c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5zM10 3.5c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5zM6 9c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm7 9c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm-4 .5c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5zm10-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0 4c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0-8c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0-4c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm-4-4c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0 4c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0-8c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm0 16c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zM10 7.5c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5zm0 4c-.28 0-.5.22-.5.5s.22.5.5.5.5-.22.5-.5-.22-.5-.5-.5z"/></svg>
  </div>
</div>

<!-- CANVAS AREA -->
<div class="canvas-area" id="canvas-area"
  ondragover="e=>{e.preventDefault();e.currentTarget.classList.add('drag-over')}"
  ondragleave="e=>{e.currentTarget.classList.remove('drag-over')}"
  ondrop="handleDrop(event)">

  <div id="canvas-wrap">
    <canvas id="main-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
  </div>

  <!-- Drop zone overlay -->
  <div class="drop-zone" id="drop-zone">
    <div class="drop-icon"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>
    <div class="drop-label">DROP IMAGE HERE</div>
    <div class="drop-sub">or click to open</div>
    <button class="drop-btn" onclick="triggerOpen()">OPEN IMAGE</button>
  </div>
</div>

<!-- RIGHT PANEL -->
<div class="rightpanel">

  <!-- Adjustments -->
  <div class="section">
    <div class="section-hd" onclick="toggleSection(this)">
      <div class="section-title">Adjustments</div>
      <span style="color:var(--muted);font-size:10px">▾</span>
    </div>
    <div class="section-body" id="sec-adjust">
      <div class="slider-row"><div class="slider-label"><span>Brightness</span><span id="v-brightness">0</span></div><input type="range" min="-100" max="100" value="0" id="sl-brightness" oninput="applyAdjust()"></div>
      <div class="slider-row"><div class="slider-label"><span>Contrast</span><span id="v-contrast">0</span></div><input type="range" min="-100" max="100" value="0" id="sl-contrast" oninput="applyAdjust()"></div>
      <div class="slider-row"><div class="slider-label"><span>Saturation</span><span id="v-saturation">0</span></div><input type="range" min="-100" max="100" value="0" id="sl-saturation" oninput="applyAdjust()"></div>
      <div class="slider-row"><div class="slider-label"><span>Hue Rotate</span><span id="v-hue">0</span></div><input type="range" min="-180" max="180" value="0" id="sl-hue" oninput="applyAdjust()"></div>
      <div class="slider-row"><div class="slider-label"><span>Exposure</span><span id="v-exposure">0</span></div><input type="range" min="-100" max="100" value="0" id="sl-exposure" oninput="applyAdjust()"></div>
      <div class="slider-row"><div class="slider-label"><span>Blur</span><span id="v-blur">0</span></div><input type="range" min="0" max="20" value="0" id="sl-blur" oninput="applyAdjust()"></div>
      <div class="slider-row"><div class="slider-label"><span>Opacity</span><span id="v-opacity">100</span></div><input type="range" min="0" max="100" value="100" id="sl-opacity" oninput="applyAdjust()"></div>
    </div>
  </div>

  <!-- Filters -->
  <div class="section">
    <div class="section-hd" onclick="toggleSection(this)">
      <div class="section-title">Filters</div>
      <span style="color:var(--muted);font-size:10px">▾</span>
    </div>
    <div class="section-body" id="sec-filters">
      <div class="filter-grid">
        <button class="filter-btn active" onclick="setFilter('none',this)">None</button>
        <button class="filter-btn" onclick="setFilter('grayscale',this)">Grayscale</button>
        <button class="filter-btn" onclick="setFilter('sepia',this)">Sepia</button>
        <button class="filter-btn" onclick="setFilter('invert',this)">Invert</button>
        <button class="filter-btn" onclick="setFilter('warm',this)">Warm</button>
        <button class="filter-btn" onclick="setFilter('cool',this)">Cool</button>
        <button class="filter-btn" onclick="setFilter('fade',this)">Fade</button>
        <button class="filter-btn" onclick="setFilter('vivid',this)">Vivid</button>
        <button class="filter-btn" onclick="setFilter('noir',this)">Noir</button>
        <button class="filter-btn" onclick="setFilter('chrome',this)">Chrome</button>
      </div>
    </div>
  </div>

  <!-- Transform -->
  <div class="section">
    <div class="section-hd" onclick="toggleSection(this)">
      <div class="section-title">Transform</div>
      <span style="color:var(--muted);font-size:10px">▾</span>
    </div>
    <div class="section-body" id="sec-transform">
      <div class="crop-controls">
        <button class="crop-btn" onclick="rotateCanvas(-90)">↺ Rotate L</button>
        <button class="crop-btn" onclick="rotateCanvas(90)">↻ Rotate R</button>
        <button class="crop-btn" onclick="flipCanvas('h')">⇄ Flip H</button>
        <button class="crop-btn" onclick="flipCanvas('v')">⇅ Flip V</button>
      </div>
      <div class="slider-row" style="margin-top:4px"><div class="slider-label"><span>Rotate°</span><span id="v-rotate">0</span></div><input type="range" min="-180" max="180" value="0" id="sl-rotate" oninput="freeRotate()"></div>
    </div>
  </div>

  <!-- Crop -->
  <div class="section">
    <div class="section-hd" onclick="toggleSection(this)">
      <div class="section-title">Crop</div>
      <span style="color:var(--muted);font-size:10px">▾</span>
    </div>
    <div class="section-body" id="sec-crop">
      <div class="filter-grid">
        <button class="filter-btn" onclick="setAspect('free')">Free</button>
        <button class="filter-btn" onclick="setAspect(1)">1:1</button>
        <button class="filter-btn" onclick="setAspect(4/3)">4:3</button>
        <button class="filter-btn" onclick="setAspect(16/9)">16:9</button>
      </div>
      <div class="crop-controls" style="margin-top:4px">
        <button class="crop-btn" onclick="setTool('crop')">Draw Crop</button>
        <button class="crop-btn" style="border-color:var(--accent);color:var(--accent)" onclick="applyCrop()">Apply Crop</button>
      </div>
    </div>
  </div>

  <!-- Draw settings -->
  <div class="section">
    <div class="section-hd" onclick="toggleSection(this)">
      <div class="section-title">Draw</div>
      <span style="color:var(--muted);font-size:10px">▾</span>
    </div>
    <div class="section-body" id="sec-draw">
      <div class="color-row">
        <input type="color" id="draw-color" value="#e8ff5a">
        <span class="color-label">Stroke Color</span>
        <input type="color" id="fill-color" value="#000000" style="margin-left:auto">
        <span class="color-label">Fill</span>
      </div>
      <div class="slider-row"><div class="slider-label"><span>Size</span><span id="v-size">12</span>px</div><input type="range" min="1" max="80" value="12" id="sl-size" oninput="document.getElementById('v-size').textContent=this.value"></div>
      <div class="slider-row"><div class="slider-label"><span>Opacity</span><span id="v-draw-opacity">100</span>%</div><input type="range" min="1" max="100" value="100" id="sl-draw-opacity" oninput="document.getElementById('v-draw-opacity').textContent=this.value"></div>
    </div>
  </div>

  <!-- History -->
  <div class="section">
    <div class="section-hd" onclick="toggleSection(this)">
      <div class="section-title">History</div>
      <span style="color:var(--muted);font-size:10px">▾</span>
    </div>
    <div class="section-body" id="sec-history">
      <div class="hist-list" id="hist-list"></div>
    </div>
  </div>

</div>

<!-- STATUSBAR -->
<div class="statusbar">
  <div class="stat">Size: <span id="stat-size">—</span></div>
  <div class="stat">Tool: <span id="stat-tool">select</span></div>
  <div class="stat">Cursor: <span id="stat-cursor">—</span></div>
  <div class="stat" id="stat-color-box">Color: <span id="stat-color">#—</span></div>
</div>

</div><!-- .app -->

<input type="file" id="file-input" accept="image/*" style="display:none" onchange="loadFile(event)">

<script src="node.js"></script>
</body>
</html>
